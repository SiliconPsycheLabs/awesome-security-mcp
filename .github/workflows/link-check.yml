name: Link check

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check README links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose README.md
          format: markdown
          output: lychee/results.md
          jobSummary: true
          fail: false
          token: ${{ github.token }}

      - name: Open or update dead-link issue
        if: steps.lychee.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const title = 'Broken links in README.md';
            const marker = '<!-- automated-link-check -->';
            const report = fs.readFileSync('lychee/results.md', 'utf8').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n\n---\nDetected by the [link-check workflow](${runUrl}). This issue is updated on subsequent failed runs.`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const { data: results } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 100 });
            const existing = results.items.find((issue) => issue.title === title && issue.body && issue.body.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Created issue #${issue.number}`);
            }

      - name: Fail on link errors
        if: steps.lychee.outputs.exit_code != '0'
        run: exit 1
