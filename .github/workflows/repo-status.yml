name: Repository status

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-status
  cancel-in-progress: false

jobs:
  report:
    name: Report repository label drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository metadata and maintain issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const checkRepositoryStatus = require('./.github/scripts/check-repo-status.js');
            await checkRepositoryStatus({ github, context, core });
